
name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Auto Logo + Build
        run: |
          rm -rf android ios web windows linux macos
          flutter create. --platforms=android --org com.sprearn --project-name sprearn_bd
          flutter pub add webview_flutter
          python3 << 'PY'
          from PIL import Image, ImageDraw, ImageFont
          img=Image.new('RGB',(1024,1024),(255,255,255))
          d=ImageDraw.Draw(img)
          f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',320)
          f2=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',70)
          d.text((150,180),'SPR',fill=(0,170,220),font=f)
          d.text((210,620),'sprearn.bd',fill=(10,60,120),font=f2)
          img.save('app_icon.png')
          PY
          for p in android/app/src/main/res/mipmap-*/; do cp app_icon.png ${p}ic_launcher.png; done
          cat > lib/main.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          void main(){runApp(const MyApp());}
          class MyApp extends StatelessWidget{const MyApp({super.key});@override Widget build(BuildContext c){return const MaterialApp(debugShowCheckedModeBanner:false,home:WebPage());}}
          class WebPage extends StatefulWidget{const WebPage({super.key});@override State<WebPage> createState()=>_W();}
          class _W extends State<WebPage>{late final WebViewController C;@override void initState(){super.initState();C=WebViewController()..setJavaScriptMode(JavaScriptMode.unrestricted)..loadRequest(Uri.parse('https://sprearn.bd'));}@override Widget build(BuildContext context){return Scaffold(body:SafeArea(child:WebViewWidget(controller:C)));}}
          EOF
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: SPR-Final-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
